<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="tieGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7b0099" />
      <stop offset="100%" stop-color="#e60073" />
    </linearGradient>
    <linearGradient id="chartGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="chartGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.15" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#e60073" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Floating Icon 1: R$ Symbol -->
  <g filter="url(#glow)" transform="translate(100, 320)">
    <circle cx="45" cy="45" r="40" fill="#ffffff" />
    <text x="45" y="55" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#2563eb" text-anchor="middle">R$</text>
  </g>

  <!-- Floating Icon 2: Car Key -->
  <g filter="url(#shadow)" transform="translate(60, 480)">
    <rect x="10" y="10" width="45" height="70" rx="10" fill="#334155" />
    <circle cx="32" cy="30" r="8" fill="#e2e8f0" />
    <path d="M 28 50 L 28 85 L 38 85 L 38 75 L 45 75 L 45 65 L 38 65 L 38 50 Z" fill="#94a3b8" />
  </g>

  <!-- Floating Icon 3: Pie Chart -->
  <g filter="url(#shadow)" transform="translate(620, 300)">
    <circle cx="50" cy="50" r="48" fill="#ffffff" />
    <path d="M 50 50 L 50 5 A 45 45 0 1 1 5 50 Z" fill="url(#chartGrad1)" />
    <path d="M 50 50 L 5 50 A 45 45 0 0 1 50 5 Z" fill="url(#chartGrad2)" />
  </g>

  <!-- Floating Icon 4: House -->
  <g filter="url(#shadow)" transform="translate(610, 480)">
    <rect x="0" y="0" width="100" height="90" rx="16" fill="#ffffff" />
    <path d="M 15 45 L 50 15 L 85 45 Z" fill="#e60073" />
    <rect x="25" y="42" width="50" height="38" fill="#f1f5f9" rx="4" />
    <rect x="42" y="54" width="16" height="26" fill="#7b0099" rx="2" />
  </g>

  <!-- Male Executive Consultant Cutout -->
  <g filter="url(#shadow)">
    <!-- Body / Suit -->
    <path d="M 220 800 L 250 500 C 260 440, 320 400, 400 400 C 480 400, 540 440, 550 500 L 580 800 Z" fill="url(#suitGrad)" />
    
    <!-- White Shirt Collar & V-Neck -->
    <polygon points="340,400 460,400 440,540 400,570 360,540" fill="#ffffff" />
    <polygon points="340,400 400,460 360,460" fill="#f8fafc" />
    <polygon points="460,400 400,460 440,460" fill="#e2e8f0" />

    <!-- Tie -->
    <polygon points="385,440 415,440 425,620 400,650 375,620" fill="url(#tieGrad)" />
    <polygon points="380,430 420,430 415,450 385,450" fill="#1d4ed8" />

    <!-- Suit Lapels -->
    <path d="M 260 480 L 340 400 L 365 550 L 290 620 Z" fill="#0f172a" />
    <path d="M 540 480 L 460 400 L 435 550 L 510 620 Z" fill="#1e293b" />

    <!-- Badge/Crachá -->
    <g transform="translate(365, 600)">
      <rect x="0" y="0" width="70" height="100" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
      <rect x="0" y="0" width="70" height="24" rx="6" fill="url(#badgeGrad)" />
      <circle cx="35" cy="50" r="16" fill="#334155" />
      <path d="M 20 74 C 20 64, 50 64, 50 74 Z" fill="#64748b" />
      <rect x="15" y="80" width="40" height="4" rx="2" fill="#94a3b8" />
    </g>

    <!-- Neck -->
    <rect x="365" y="320" width="70" height="90" fill="#d97706" opacity="0.85" rx="10" />
    <path d="M 365 320 Q 400 370 435 320 L 435 410 L 365 410 Z" fill="#b45309" opacity="0.9" />

    <!-- Head & Face -->
    <ellipse cx="400" cy="240" rx="85" ry="105" fill="#d97706" opacity="0.85" />
    
    <!-- Hair -->
    <path d="M 305 220 C 305 120, 495 120, 495 220 C 480 145, 320 145, 305 220 Z" fill="#1e293b" />
    <path d="M 310 190 Q 400 130 490 190 Q 400 150 310 190 Z" fill="#0f172a" />

    <!-- Eyes -->
    <ellipse cx="365" cy="235" rx="9" ry="6" fill="#ffffff" />
    <circle cx="365" cy="235" r="4" fill="#0f172a" />
    <ellipse cx="435" cy="235" rx="9" ry="6" fill="#ffffff" />
    <circle cx="435" cy="235" r="4" fill="#0f172a" />

    <!-- Eyebrows -->
    <path d="M 348 218 Q 365 210 380 218" stroke="#1e293b" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M 420 218 Q 435 210 452 218" stroke="#1e293b" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- Nose -->
    <path d="M 400 235 L 395 260 L 405 260" stroke="#b45309" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Friendly Smile -->
    <path d="M 365 275 Q 400 305 435 275" stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M 360 273 Q 400 312 440 273" stroke="#b45309" stroke-width="3" fill="none" />

    <!-- Beard / Short stubble -->
    <path d="M 320 250 C 320 330, 480 330, 480 250 C 460 340, 340 340, 320 250 Z" fill="#1e293b" opacity="0.35" />
  </g>
</svg>
